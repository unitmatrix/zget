name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / ${{ matrix.architecture }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            compiler: gcc
            runner: ubuntu-24.04
          - architecture: x86_64
            compiler: clang
            runner: ubuntu-24.04
          - architecture: arm64
            compiler: gcc
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        timeout-minutes: 7
        run: bash -x scripts/install-ubuntu-dependencies.sh
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify staged install
        if: matrix.architecture == 'x86_64' && matrix.compiler == 'gcc'
        env:
          DESTDIR: ${{ github.workspace }}/stage
        run: |
          cmake --install build
          test -x stage/usr/bin/zget
          test -f stage/usr/include/zget.h
          test -f stage/usr/include/zget_version.h
          test -f stage/usr/share/man/man1/zget.1
          test -f stage/usr/share/licenses/zget/LICENSE

          project_version="$(cat VERSION)"
          project_major="${project_version%%.*}"
          version_tail="${project_version#*.}"
          project_minor="${version_tail%%.*}"
          if [[ "${project_major}" = 0 ]]; then
            abi_version="${project_major}.${project_minor}"
          else
            abi_version="${project_major}"
          fi
          library="$(find stage/usr -type f -name "libzget.so.${project_version}" -print -quit)"
          pc_file="$(find stage/usr -type f -path '*/pkgconfig/libzget.pc' -print -quit)"
          test -n "${library}"
          test -n "${pc_file}"
          test -L "$(dirname "${library}")/libzget.so"
          test -L "$(dirname "${library}")/libzget.so.${abi_version}"
          readelf -d "${library}" | grep -Eq "\\(SONAME\\).*\\[libzget\\.so\\.${abi_version}\\]"
          pc_dir="$(dirname "${pc_file}")"
          PKG_CONFIG_PATH="${pc_dir}" pkg-config --validate libzget
          installed_version="$(PKG_CONFIG_PATH="${pc_dir}" pkg-config --modversion libzget)"
          test "${installed_version}" = "${project_version}"

          # Validation alone does not prove that the installed paths are
          # usable from a package staging root. Compile through pkg-config's
          # sysroot support so this test cannot accidentally find host zget.
          pc_flags="$(PKG_CONFIG_PATH="${pc_dir}" \
            PKG_CONFIG_SYSROOT_DIR="${GITHUB_WORKSPACE}/stage" \
            pkg-config --cflags --libs libzget)"
          ${{ matrix.compiler }} tests/package/main.c ${pc_flags} \
            -o package-consumer-pkg-config
          pc_version="$(LD_LIBRARY_PATH="$(dirname "${library}")" \
            ./package-consumer-pkg-config)"
          test "${pc_version}" = "${project_version}"

          cmake -S tests/package -B package-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/stage/usr"
          cmake --build package-build --parallel 2
          test "$(package-build/consumer_static)" = "${project_version}"
          shared_version="$(LD_LIBRARY_PATH="$(dirname "${library}")" \
            package-build/consumer)"
          test "${shared_version}" = "${project_version}"

  musl:
    name: Linux / x86_64 / musl
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, test, and verify installation on Alpine
        run: |
          # Plain progress keeps the package installation and every Dockerfile
          # command visible in the workflow log when this environment changes.
          docker build --progress=plain --tag zget-musl-ci \
            .github/containers/musl

          # Keep container-owned build products outside the checkout. The
          # read-only mount also catches build rules that modify source files.
          docker run --rm --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/source:ro" \
            zget-musl-ci sh -euxc '
              cmake -S /source -B /tmp/build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr
              cmake --build /tmp/build --parallel 2
              ctest --test-dir /tmp/build --output-on-failure
              DESTDIR=/tmp/stage cmake --install /tmp/build

              # Exercise both exported library targets against musl. This is
              # compatibility coverage, not a fully static release build.
              cmake -S /source/tests/package -B /tmp/package-build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/tmp/stage/usr
              cmake --build /tmp/package-build --parallel 2
              expected="$(cat /source/VERSION)"
              test "$(/tmp/package-build/consumer_static)" = "${expected}"
              shared="$(LD_LIBRARY_PATH=/tmp/stage/usr/lib \
                /tmp/package-build/consumer)"
              test "${shared}" = "${expected}"
            '

  macos:
    name: macOS / ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        env:
          CC: clang
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        timeout-minutes: 7
        run: bash -x scripts/install-ubuntu-dependencies.sh clang
      - name: Configure
        env:
          CC: clang
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DZGET_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  fuzz-smoke:
    name: Parser fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        timeout-minutes: 7
        run: bash -x scripts/install-ubuntu-dependencies.sh clang
      - name: Configure and build fuzzers
        env:
          CC: clang
        run: cmake -S . -B build -DBUILD_TESTING=OFF -DZGET_BUILD_FUZZERS=ON && cmake --build build --parallel 2
      - name: Smoke-test parsers
        run: |
          for target in fuzz_eocd fuzz_cd fuzz_cd_stream fuzz_zip64_extra fuzz_local fuzz_content_range; do
            "build/$target" -runs=1000
          done

  ci-success:
    name: CI / All checks
    if: ${{ always() }}
    needs: [linux, musl, macos, sanitizers, fuzz-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Check required jobs
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          MUSL_RESULT: ${{ needs.musl.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
          FUZZ_RESULT: ${{ needs.fuzz-smoke.result }}
        run: |
          test "${LINUX_RESULT}" = success
          test "${MUSL_RESULT}" = success
          test "${MACOS_RESULT}" = success
          test "${SANITIZERS_RESULT}" = success
          test "${FUZZ_RESULT}" = success
